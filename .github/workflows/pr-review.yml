# Automated PR review with Qodo PR-Agent. Runs only for pull requests from
# branches of this repository (never from forks, so the model key is never
# exposed to outside code), and on a `/review` comment from a collaborator.
name: PR-Agent Review

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
  issue_comment:
    types: [created]

concurrency:
  group: pr-agent-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: ${{ github.event_name != 'issue_comment' }}

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  review:
    runs-on: ubuntu-latest
    if: >-
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       !github.event.pull_request.draft) ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request &&
       startsWith(github.event.comment.body, '/review') &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    steps:
      # Pinned to the v0.46.0 release commit: a mutable ref would let a compromised
      # update read the model key. Bump it deliberately.
      - uses: qodo-ai/pr-agent@1d01f24f455bb879c1d9c557ad7de3d72dcc7975 # v0.46.0
        env:
          CONFIG.MODEL: deepseek/deepseek-v4-pro
          CONFIG.FALLBACK_MODELS: '["deepseek/deepseek-v4-pro"]'
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK.KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTION_CONFIG.AUTO_REVIEW: "true"
          GITHUB_ACTION_CONFIG.AUTO_DESCRIBE: "false"
          GITHUB_ACTION_CONFIG.AUTO_IMPROVE: "false"

      # PR-Agent exits 0 even when every model call fails (a bad key, no credit), which
      # would show a green check with no review. Fail unless a review comment with a
      # score was written or updated during this run.
      - name: Fail when no review was produced
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          since=$(date -u -d '15 minutes ago' +%Y-%m-%dT%H:%M:%SZ)
          n=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" --paginate \
            --jq "[.[] | select(.updated_at >= \"${since}\" and (.body | contains(\"Score\")))] | length")
          if [ "${n}" -lt 1 ]; then
            echo "::error::PR-Agent wrote no scored review during this run (model call failed?)"
            exit 1
          fi
