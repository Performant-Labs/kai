# Automated PR review with Qodo PR-Agent. Runs only for pull requests from
# branches of this repository (never from forks, so no key or token is ever
# exposed to outside code), and on a `/review` comment from a collaborator.
#
# The reviewer is Claude, through the Claude Code CLI (#190), the same path as the
# default reviewer of Performant-Labs/playbook's pr-review-reusable.yml. Kai is public
# and cannot call that private workflow, so the steps are copied here with the same pins
# and guards. The token is the org secret CLAUDE_CODE_OAUTH_TOKEN (a `claude setup-token`
# subscription token), shared with this repository. With the token absent, the review
# falls back to the DeepSeek API path.
name: PR-Agent Review

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
  issue_comment:
    types: [created]

concurrency:
  group: pr-agent-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: ${{ github.event_name != 'issue_comment' }}

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  review:
    runs-on: ubuntu-latest
    if: >-
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       !github.event.pull_request.draft) ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request &&
       startsWith(github.event.comment.body, '/review') &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    steps:
      - name: Choose the reviewer backend
        id: cfg
        env:
          # Only whether the token EXISTS is read here, never its value.
          CLAUDE_TOKEN_SET: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
        run: |
          if [ "$CLAUDE_TOKEN_SET" = "true" ]; then
            echo "backend=claude-cli" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::CLAUDE_CODE_OAUTH_TOKEN is not available to this repository; reviewing with DeepSeek"
            echo "backend=api" >> "$GITHUB_OUTPUT"
          fi

      # A subscription token cannot be scoped or capped like an API key, so only the
      # repository's own people may spend it: a comment from OWNER/MEMBER/COLLABORATOR,
      # on a pull request whose head is a branch of THIS repository (never a fork). The
      # job's `if` already says so; this re-checks the PR itself for the comment path.
      - name: Refuse untrusted triggers before the token is used
        if: steps.cfg.outputs.backend == 'claude-cli'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number || github.event.issue.number }}
          ASSOCIATION: ${{ github.event.comment.author_association }}
        run: |
          if [[ "$EVENT_NAME" == "issue_comment" ]]; then
            case "$ASSOCIATION" in
              OWNER|MEMBER|COLLABORATOR) ;;
              *) echo "::error::comment author association '${ASSOCIATION}' may not spend the Claude subscription token"; exit 1 ;;
            esac
          fi
          head=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR}" --jq '.head.repo.full_name // ""')
          if [[ "$head" != "$GITHUB_REPOSITORY" ]]; then
            echo "::error::PR #${PR} comes from '${head}', not ${GITHUB_REPOSITORY}; refusing to review it with the Claude subscription token"
            exit 1
          fi

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: steps.cfg.outputs.backend == 'claude-cli'
        with:
          python-version: "3.12"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.cfg.outputs.backend == 'claude-cli'
        with:
          node-version: "24"
          package-manager-cache: false

      # Supply chain: the wrapper has no release, so it is pinned by COMMIT; pr-agent and the
      # Claude Code CLI by version. Everything installs before the step that holds the token,
      # and the token is never in an install step's environment. Bump the pins deliberately,
      # together with the playbook's.
      - name: Install PR-Agent, the CLI handler and the Claude Code CLI
        if: steps.cfg.outputs.backend == 'claude-cli'
        env:
          PR_AGENT_VERSION: "0.49.0"
          HATCHLING_VERSION: "1.33.0"
          HANDLERS_COMMIT: "0b10c1b658bd4aba8fb93a6d439499c48f06dfcb"
          CLAUDE_CLI_VERSION: "2.1.302"
          PR_AGENT_CLI_HANDLER: claude_code
        run: |
          python3 -m pip install --quiet --disable-pip-version-check \
            "pr-agent[github]==${PR_AGENT_VERSION}" "hatchling==${HATCHLING_VERSION}"
          python3 -m pip install --quiet --disable-pip-version-check --no-deps --no-build-isolation \
            "git+https://github.com/akalongman/pr-agent-cli-handlers@${HANDLERS_COMMIT}"
          npm install --global --ignore-scripts "@anthropic-ai/claude-code@${CLAUDE_CLI_VERSION}"
          # --ignore-scripts also skips the CLI's own postinstall, which puts its platform binary
          # in place; run exactly that one script, by path (a local copy, no network).
          node "$(dirname "$(readlink -f "$(command -v claude)")")/../install.cjs"
          pr-agent-cli-handlers --help >/dev/null
          claude --version

      - name: PR-Agent review (Claude CLI)
        if: steps.cfg.outputs.backend == 'claude-cli'
        env:
          PR_AGENT_CLI_HANDLER: claude_code
          PR_AGENT_CLI_TIMEOUT: "900"
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CONFIG__MODEL: claude-opus-5-5
          CONFIG__FALLBACK_MODELS: "[]"
          CONFIG__REASONING_EFFORT: high
          # PR-Agent does not know Claude model ids; give it a context budget, or its default
          # is far smaller and silently drops files.
          CONFIG__CUSTOM_MODEL_MAX_TOKENS: "131072"
          CONFIG__MAX_MODEL_TOKENS: "131072"
          GITHUB_ACTION_CONFIG__PR_ACTIONS: '["opened","reopened","ready_for_review","review_requested","synchronize"]'
          GITHUB_ACTION_CONFIG__AUTO_REVIEW: "true"
          GITHUB_ACTION_CONFIG__AUTO_DESCRIBE: "false"
          GITHUB_ACTION_CONFIG__AUTO_IMPROVE: "false"
          PR_REVIEWER__REQUIRE_TICKET_ANALYSIS_REVIEW: "false"
          PR_REVIEWER__REQUIRE_SCORE_REVIEW: "true"
          CONFIG__PROPAGATE_TOOL_ERRORS: "true"
        run: pr-agent-cli-handlers action

      # Pinned to the v0.46.0 release commit: a mutable ref would let a compromised
      # update read the model key. Bump it deliberately.
      - name: PR-Agent review (DeepSeek, when the Claude token is absent)
        if: steps.cfg.outputs.backend == 'api'
        uses: qodo-ai/pr-agent@1d01f24f455bb879c1d9c557ad7de3d72dcc7975 # v0.46.0
        env:
          CONFIG.MODEL: deepseek/deepseek-v4-pro
          CONFIG.FALLBACK_MODELS: '["deepseek/deepseek-v4-pro"]'
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK.KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTION_CONFIG.AUTO_REVIEW: "true"
          GITHUB_ACTION_CONFIG.AUTO_DESCRIBE: "false"
          GITHUB_ACTION_CONFIG.AUTO_IMPROVE: "false"

      # PR-Agent can exit 0 even when every model call fails (a bad key, no credit), which
      # would show a green check with no review. Fail unless a review comment with a
      # score was written or updated during this run.
      - name: Fail when no review was produced
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          since=$(date -u -d '15 minutes ago' +%Y-%m-%dT%H:%M:%SZ)
          n=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" --paginate \
            --jq "[.[] | select(.updated_at >= \"${since}\" and (.body | contains(\"Score\")))] | length")
          if [ "${n}" -lt 1 ]; then
            echo "::error::PR-Agent wrote no scored review during this run (model call failed?)"
            exit 1
          fi
