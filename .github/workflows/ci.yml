# Lint and secret scan. Runs on GitHub-hosted runners only: this is a public
# repository, so no self-hosted runner may execute code from a pull request.
# The build and test suite live in push.yml.
name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actionlint:
    name: Pre-flight (actionlint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Lint workflow files
        run: |
          curl -fsSLo actionlint.tgz https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz
          echo "023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757  actionlint.tgz" | sha256sum -c -
          tar -xzf actionlint.tgz actionlint
          # release.yml is upstream's: it uses macOS/Windows runner labels this
          # actionlint release does not know, and has shellcheck notes.
          ./actionlint -ignore 'label ".*" is unknown' -ignore 'shellcheck reported issue'

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Scan the full history
        run: |
          curl -fsSLo gitleaks.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.24.2/gitleaks_8.24.2_linux_x64.tar.gz
          echo "fa0500f6b7e41d28791ebc680f5dd9899cd42b58629218a5f041efa899151a8e  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks
          ./gitleaks git . --no-banner --redact
