# .pr_agent.toml — PR-Agent configuration for Kai
# From playbook/pipelines/pr-reviewer/templates/pr_agent.toml; only extra_instructions is Kai-specific.
#
# Copy to your project root and customise the extra_instructions section
# to match your project's skills/, forbidden patterns, and conventions.
#
# Docs: https://qodo-merge-docs.qodo.ai/usage-guide/configuration_options/

[config]
model = "deepseek/deepseek-v4-pro"
fallback_models = ["deepseek/deepseek-v4-pro"]
verbosity_level = 1
max_description_tokens = 1500
max_commits_tokens = 1500
custom_model_max_tokens = 131072
# Raised above the 32K default so full diffs fit without driving the
# output-token budget negative on large PRs.
max_model_tokens = 64000

[pr_reviewer]
require_score_review = true
require_tests_review = true
require_security_review = true
require_focused_review = false
require_ticket_analysis_review = false
num_code_suggestions = 4
inline_code_comments = true
automatic_review = true
persistent_comment = true
final_update_message = false
extra_instructions = """
You are the SPEC-ENFORCER for Kai (a Wails v3 desktop translation app: Go backend, Svelte frontend,
Swift system bridge). Your job is drift detection against this repo's documented rules, not code
improvement.

MANDATORY CONTEXT - read before scoring, and cite the file when you flag a violation:
1. AGENTS.md and CLAUDE.md at the repo root: the ground rules, the authoritative test command
   (`test.unit.command` in .opencode/pipeline.config.json) and the worktree/PR conventions.
2. README_EN.md and docs/PLAN.md: what the app does and the plan behind it.
3. Epic and issue text in the tracker for the change under review: epic #6 (translate window) and
   epic #51 (backend-owned language model) pin conventions and locked decisions. Do not suggest
   changes that contradict a locked decision recorded there or in docs/handoffs/decisions.md.

PRIMARY JOB - spec drift detection (BLOCKING when violated, cite the source):
1. Secrets: credentials, API keys or tokens committed to the diff.
2. Upstream leakage: any change aimed at the upstream dtapps/kai instead of Performant-Labs/kai-private.
3. Generated files edited by hand: frontend/bindings/** (regenerated by `wails3 generate bindings`)
   and .opencode/agents/* (AGENTS.md: generated, never edit the generated files).
4. The embedded SQL migrations internal/historystore/migration.sql and
   internal/httplogstore/migration.sql are split on the semicolon character by their loaders, so a
   comment line in them must never contain one (issue #64: it aborted app launch).
5. New behavior in internal/ or frontend/src without a test that would fail if the behavior were
   removed. Epic #6 requires real files in t.TempDir(), real loopback httptest servers with the
   engine's Endpoint pointed at them, and jsdom with real localStorage: flag mocks or interception
   of the code under test.
6. Language support: a new Language value without a capability decision for every engine
   (internal/engine/language_capability.go has an exhaustiveness test), or a target variant an
   engine cannot serve being silently degraded to its base language.
7. English-only new code: comments, identifiers and log/error strings in English. The Chinese UI
   locale (frontend/src/i18n/zh-CN.ts, internal/i18n/locales/zh-CN.json) is a feature, not debt,
   and must keep key parity with en-US.

SECONDARY JOB - quality:
- Security issues (injection, unsafe file or network handling).
- Runtime regressions: goroutine or connection leaks, unbounded work, races on shared state.
- Behavior a user would notice that the diff does not test.

REVIEW STYLE:
- Distinguish BLOCKING (drift from a cited rule, security, missing required test) from NIT.
  Every BLOCKING finding MUST cite its source. When in doubt, prefer NIT.
- Do not propose rewrites or alternative architectures. Review the change that was made.
- Do not report that you could not run the tests. State only what the diff shows.

OUTPUT SHAPE:
- Lead with a one-line verdict: BLOCKING / NITS / CLEAN.
- Then the standard PR-Agent sections.
- Inline comments focus on exact lines violating a cited rule.
"""

[pr_code_suggestions]
num_code_suggestions = 4
summarize = true
extra_instructions = """
Only suggest changes that bring the diff into compliance with skills/*.md or docs/planning/*.md.
Every suggestion must cite its source (skill filename or spec section).
Do not suggest refactors or alternative patterns not required by the spec.
"""

[pr_description]
publish_description_as_comment = false
add_original_user_description = true
keep_original_user_title = true

[github]
publish_inline_comments = true
publish_output = true
publish_output_progress = false

[github_action_config]
auto_review = true
auto_improve = false
pr_actions = ["opened", "reopened", "ready_for_review", "review_requested", "synchronize"]

[litellm]
drop_params = true
max_model_len = 131072

[ignore]
glob = [
  'package-lock.json',
  'yarn.lock',
  'pnpm-lock.yaml',
  'dist/**',
  'coverage/**',
  '*.min.js',
  '*.min.css',
  'docs/handoffs/**',
]
